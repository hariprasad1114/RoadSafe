services:
  - type: web
    name: roadsafe-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: INSFORGE_URL
        sync: false
      - key: INSFORGE_ANON_KEY
        sync: false
      - key: INSFORGE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: DATA_CACHE_TTL_SECONDS
        value: "600"
      - key: MAX_DBSCAN_POINTS
        value: "20000"
      - key: MAX_EXPORT_ROWS
        value: "25000"
      - key: RATE_LIMIT_PER_MINUTE
        value: "180"
      - key: MAX_UPLOAD_MB
        value: "30"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: PYTHON_VERSION
        value: "3.11.4"
